[build]
  command = "npm install && npm run build"
  publish = "dist"

[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/booking-share/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/agendamento/*"
  to = "https://yjuqixthmwgnzkjummaf.supabase.co/functions/v1/booking-share/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"
